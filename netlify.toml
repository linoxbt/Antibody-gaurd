# Antibody Guard site. Netlify builds it from this repository: frontend/ plus the files generated from
# deployments/ and abi/ by scripts/build-web.ts, and the wallet bundle from wallet/.
# Build variables (set on the Netlify site; all optional, defaults in brackets):
#   GUARD_API_ORIGIN  where /api/* goes  [https://antibody-guard-production.up.railway.app]
#   REOWN_PROJECT_ID  the Reown (WalletConnect) project ID for wallet connection
#   NODE_VERSION      22
[build]
  publish = "web-dist"
  command = "npm ci --omit=dev --no-audit --no-fund && (cd wallet && npm ci --no-audit --no-fund) && npm run web"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.reown.com; font-src 'self' https://fonts.reown.com; img-src 'self' data: blob: https://*.walletconnect.com https://*.walletconnect.org https://*.reown.com https://api.web3modal.org https://imagedelivery.net; connect-src 'self' https://sepolia.base.org https://ethereum-sepolia-rpc.publicnode.com https://lasna-rpc.rnk.dev wss://relay.walletconnect.com wss://relay.walletconnect.org wss://www.walletlink.org https://*.walletconnect.com https://*.walletconnect.org https://*.reown.com https://api.web3modal.org https://pulse.walletconnect.org; frame-src https://verify.walletconnect.com https://verify.walletconnect.org https://secure.walletconnect.com https://secure.walletconnect.org; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000"
    Cross-Origin-Opener-Policy = "same-origin"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/install.sh"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "no-cache"

[[headers]]
  for = "/evidence.json"
  [headers.values]
    Cache-Control = "no-cache"

# the console is a single-page app
[[redirects]]
  from = "/app/*"
  to = "/app.html"
  status = 200

# the earlier status page
[[redirects]]
  from = "/live"
  to = "/app/loops"
  status = 301
[[redirects]]
  from = "/live.html"
  to = "/app/loops"
  status = 301
